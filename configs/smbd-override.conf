# /etc/systemd/system/smbd.service.d/timecapsule.conf
# Samba ne démarre que si la capsule est montée : sinon Time Machine
# écrirait dans un dossier vide sur la carte SD du Pi.
# Le plafond de processus empêche des centaines de sessions bloquées
# (607 smbd observés en octobre 2026) de saturer la machine.
[Unit]
After=timecapsule-mount.service
Requires=timecapsule-mount.service

[Service]
TasksMax=400
